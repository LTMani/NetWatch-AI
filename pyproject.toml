[tool.poetry]
name = "netwatch-ai"
version = "1.0.0"
description = "AI-powered enterprise network usage, discovery, and intelligence platform"
authors = ["NetWatch AI Engineering Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
Flask = "^3.0.0"
SQLAlchemy = "^2.0.0"
PyJWT = "^2.8.0"
reportlab = "^4.0.0"
cryptography = "^42.0.0"
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
